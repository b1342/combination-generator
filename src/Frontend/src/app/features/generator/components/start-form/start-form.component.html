<form class="start-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label for="n">מספר האיברים (1–20)</label>
  <div class="row">
    <input
      id="n"
      type="number"
      min="1"
      max="20"
      step="1"
      formControlName="n"
      [attr.aria-invalid]="showError()"
      aria-describedby="n-error" />
    <button type="submit" [disabled]="disabled()">התחל</button>
  </div>
  @if (showError()) {
    <p id="n-error" class="field-error">יש להזין מספר שלם בין 1 ל-20.</p>
  }
</form>
