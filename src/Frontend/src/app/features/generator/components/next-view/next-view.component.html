<section class="card next-view">
  @if (current(); as item) {
    <!-- המספר הסידורי, ומתחתיו הקומבינציה עצמה, כל איבר בריבוע משלו -->
    <p class="current-line">קומבינציה מספר <bdi>{{ item.number | groupDigits }}</bdi></p>
    <ol class="tiles" dir="ltr" [attr.aria-label]="'[' + item.permutation.join(',') + ']'">
      @for (value of item.permutation; track $index) {
        <li class="tile">{{ value }}</li>
      }
    </ol>
  } @else {
    <p class="eyebrow">עוד לא הוצגה קומבינציה</p>
    <p class="muted">לחצו על "הבא" להצגת הקומבינציה הראשונה.</p>
  }

  <div class="actions">
    <button type="button" class="btn btn-secondary" [disabled]="disabled() || !hasPrevious()" (click)="previousRequested.emit()">הקודם</button>
    <button type="button" class="btn btn-primary" [disabled]="disabled() || atEnd()" (click)="nextRequested.emit()">הבא</button>
    <button type="button" class="btn btn-outline" [disabled]="disabled() || atEnd()" (click)="allRequested.emit()">כל הקומבינציות</button>
  </div>
</section>
