<section class="card next-view">
  @if (current(); as item) {
    <!-- הנוסח מהמטלה: "קומבינציה מספר 1 – [1,2,3]". האריחים מתחת הם תצוגה נוספת של אותה תמורה. -->
    <p class="current-line">
      קומבינציה מספר <bdi>{{ item.number | groupDigits }}</bdi> –
      <bdi class="permutation" dir="ltr">[{{ item.permutation.join(',') }}]</bdi>
    </p>
    <ol class="tiles" dir="ltr" aria-hidden="true">
      @for (value of item.permutation; track $index) {
        <li class="tile">{{ value }}</li>
      }
    </ol>
  } @else {
    <p class="eyebrow">עוד לא הוצגה קומבינציה</p>
    <p class="muted">לחצו על "הבא" להצגת הקומבינציה הראשונה.</p>
  }

  <div class="actions">
    <button type="button" class="btn btn-secondary" [disabled]="disabled() || !hasPrevious()" (click)="previousRequested.emit()">הקודם</button>
    <button type="button" class="btn btn-primary" [disabled]="disabled()" (click)="nextRequested.emit()">הבא</button>
    <button type="button" class="btn btn-outline" [disabled]="disabled()" (click)="allRequested.emit()">כל הקומבינציות</button>
  </div>
</section>
